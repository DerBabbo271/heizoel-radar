name: Heizöl-Datenprüfung
on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data (price source not yet configured)
        run: python fetch_prices.py
