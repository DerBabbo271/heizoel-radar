name: Heizöl24 Schnittstellen-Test
on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test 90552 / 2000 L (no price publishing)
        run: python fetch_prices.py
