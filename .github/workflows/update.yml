name: Heizöl-Preisradar
on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
permissions:
  contents: write
concurrency:
  group: heizoel-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate quote
        run: python fetch_prices.py
      - name: Commit verified price and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified heating oil quote"
            git push
          fi
